[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-lakehouse"
version = "0.1.0"
description = "Quality-gated LLM enrichment on a live public-signal lakehouse."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pulse" }]
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.5",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "duckdb>=1.1",
  "dbt-core>=1.8,<1.11",
  "dbt-duckdb>=1.8,<1.11",
  "pyarrow>=17",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pulse = "pulse.cli:main"

[tool.setuptools.packages.find]
include = ["pulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
